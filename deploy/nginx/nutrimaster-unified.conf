upstream nutrimaster_unified {
    server 127.0.0.1:5000;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=nutrimaster_agent_rate:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=nutrimaster_agent_conn:10m;
limit_req_zone $http_x_forwarded_for zone=nutrimaster_bohrium_agent_rate:10m rate=2r/s;
limit_conn_zone $http_x_forwarded_for zone=nutrimaster_bohrium_agent_conn:10m;

# Bohrium keeps the public HTTPS hostname and forwards its origin traffic to
# Aliyun's public port 5000.  A systemd socket bound only to the ECS private-IP
# side of that NAT carries the TCP stream to this localhost-only Nginx listener;
# unified FastAPI can therefore retain its separate 127.0.0.1:5000 listener.
# Nginx remains the HTTP security boundary before unified FastAPI.
server {
    listen 127.0.0.1:5080;
    server_name _;
    client_max_body_size 50M;
    limit_req_status 429;
    limit_conn_status 429;

    location = /api/pi/internal {
        return 404;
    }

    location ^~ /api/pi/internal/ {
        return 404;
    }

    location = /api/query {
        client_max_body_size 1M;
        limit_req zone=nutrimaster_bohrium_agent_rate burst=5 nodelay;
        limit_conn nutrimaster_bohrium_agent_conn 2;
        proxy_pass http://nutrimaster_unified;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600;
        proxy_connect_timeout 30;
        proxy_send_timeout 600;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        add_header X-Accel-Buffering no;
    }

    location = /api/pi/query {
        client_max_body_size 1M;
        limit_req zone=nutrimaster_bohrium_agent_rate burst=5 nodelay;
        limit_conn nutrimaster_bohrium_agent_conn 2;
        proxy_pass http://nutrimaster_unified;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600;
        proxy_connect_timeout 30;
        proxy_send_timeout 600;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        add_header X-Accel-Buffering no;
    }

    location = /api/rag/search {
        client_max_body_size 1M;
        limit_req zone=nutrimaster_bohrium_agent_rate burst=5 nodelay;
        limit_conn nutrimaster_bohrium_agent_conn 2;
        proxy_pass http://nutrimaster_unified;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600;
        proxy_connect_timeout 30;
        proxy_send_timeout 600;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://nutrimaster_unified;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
        proxy_connect_timeout 30;
        proxy_send_timeout 300;
    }
}

server {
    listen 443 ssl;
    server_name nutrimaster.bio www.nutrimaster.bio;
    client_max_body_size 50M;
    limit_req_status 429;
    limit_conn_status 429;

    # This capability endpoint is only for the localhost Pi sidecar.  A public
    # request proxied by Nginx would otherwise appear loopback to FastAPI.
    location = /api/pi/internal {
        return 404;
    }

    location ^~ /api/pi/internal/ {
        return 404;
    }

    location = /api/query {
        client_max_body_size 1M;
        limit_req zone=nutrimaster_agent_rate burst=5 nodelay;
        limit_conn nutrimaster_agent_conn 2;
        proxy_pass http://nutrimaster_unified;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600;
        proxy_connect_timeout 30;
        proxy_send_timeout 600;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header X-Accel-Buffering no;
    }

    location = /api/pi/query {
        client_max_body_size 1M;
        limit_req zone=nutrimaster_agent_rate burst=5 nodelay;
        limit_conn nutrimaster_agent_conn 2;
        proxy_pass http://nutrimaster_unified;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600;
        proxy_connect_timeout 30;
        proxy_send_timeout 600;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header X-Accel-Buffering no;
    }

    location = /api/rag/search {
        client_max_body_size 1M;
        limit_req zone=nutrimaster_agent_rate burst=5 nodelay;
        limit_conn nutrimaster_agent_conn 2;
        proxy_pass http://nutrimaster_unified;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600;
        proxy_connect_timeout 30;
        proxy_send_timeout 600;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://nutrimaster_unified;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
        proxy_connect_timeout 30;
        proxy_send_timeout 300;
    }

    ssl_certificate /etc/letsencrypt/live/nutrimaster.bio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nutrimaster.bio/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name nutrimaster.bio www.nutrimaster.bio;
    return 301 https://$host$request_uri;
}
